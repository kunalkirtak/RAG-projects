version: "3.9"

services:
api:
    build: .
    image: multi-document-research-agent:latest
    container_name: research-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

streamlit:
    build: .
    image: multi-document-research-agent:latest
    container_name: research-agent-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    depends_on:
      - api
    restart: unless-stopped
